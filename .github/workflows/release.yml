name: Release

# Push a tag such as v0.2.0 to publish Legato-0.2.0.zip on the Releases page.
# With these repository secrets the app is signed with a Developer ID and notarized,
# so it opens on any Mac without a warning. Without them the zip is still published.
#   DEVELOPER_ID_P12           base64 of the Developer ID Application certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  its password
# Short of a Developer ID, a self-signed certificate that stays the same from release to
# release keeps macOS from asking for the Microphone and Accessibility permissions after updates.
#   RELEASE_P12                base64 of that certificate (.p12)
#   RELEASE_P12_PASSWORD       its password
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              its key ID
#   NOTARY_ISSUER              its issuer ID
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' || secrets.RELEASE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          RELEASE_P12: ${{ secrets.RELEASE_P12 }}
          RELEASE_P12_PASSWORD: ${{ secrets.RELEASE_P12_PASSWORD }}
        if: env.HAS_SIGNING == 'true'
        run: |
          if [ -n "$DEVELOPER_ID_P12" ]; then
            P12="$DEVELOPER_ID_P12" P12_PASSWORD="$DEVELOPER_ID_P12_PASSWORD"
          else
            P12="$RELEASE_P12" P12_PASSWORD="$RELEASE_P12_PASSWORD"
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Not -v: a self-signed certificate is not "valid" to macOS, and still signs fine.
          IDENTITIES=$(security find-identity -p codesigning "$KEYCHAIN")
          IDENTITY=$(echo "$IDENTITIES" | grep -o '"Developer ID Application[^"]*"' | head -1)
          [ -n "$IDENTITY" ] || IDENTITY=$(echo "$IDENTITIES" | grep -o '"[^"]*"' | head -1)
          IDENTITY=$(echo "$IDENTITY" | tr -d '"')
          if [ -z "$IDENTITY" ]; then echo "::error::No signing identity in the certificate secret"; exit 1; fi
          echo "LEGATO_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Check the tag matches the app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: swift test
      - run: ./scripts/build-app.sh
      - name: Notarize and zip
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ] && [[ "${LEGATO_SIGN_IDENTITY:-}" == "Developer ID Application"* ]]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          fi
          ZIP=$(./scripts/package.sh)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without notarization, the notes explain how to open the app; gh puts them above the changelog.
          NOTES=""
          [ "${NOTARIZED:-}" = true ] || NOTES=$(cat .github/release-unsigned.md)
          [ "$HAS_SIGNING" = true ] || NOTES="$NOTES"$'\n>\n'"$(cat .github/release-adhoc.md)"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Legato ${GITHUB_REF_NAME#v}" --notes "$NOTES" --generate-notes
