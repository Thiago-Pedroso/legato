name: CI

# macOS minutes cost ten times more on a private repository, so this runs on pull requests
# and by hand. Once the repository is public, add `push: branches: [main]`.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}
      - run: swift build -c release
      - run: swift test
